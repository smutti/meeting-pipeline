[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "local-meeting-pipeline"
version = "0.2.1"
description = "Local multilingual meeting workflows, review, voice profiles and glossaries"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/smutti/meeting-pipeline"
Issues = "https://github.com/smutti/meeting-pipeline/issues"

[project.scripts]
meet = "meeting_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meeting_pipeline = ["recipes/*.json"]
